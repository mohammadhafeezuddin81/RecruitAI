<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Layer Gradients -->
    <linearGradient id="feGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="beGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Side 3D Gradients -->
    <linearGradient id="sideDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Neon Connection Line Glow -->
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Subtle Isometric Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0 150 L 1200 750 M 0 300 L 1200 900 M 0 0 L 1200 600 M 0 -150 L 1200 450" />
    <path d="M 0 600 L 1200 0 M 0 750 L 1200 150 M 0 450 L 1200 -150 M 0 900 L 1200 300" />
  </g>

  <!-- Title & Subtitle Header -->
  <text x="600" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    RECRUITAI — 3D ISOMETRIC CLOUD ARCHITECTURE
  </text>
  <text x="600" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94a3b8" text-anchor="middle">
    Autonomous Multi-Agent System • Express API Gateway • FastAPI LangGraph Engine • Supabase pgvector RAG
  </text>

  <!-- 3D LAYER 1: CLIENT / FRONTEND TIER (TOP) -->
  <g transform="translate(180, 110)">
    <!-- Top Face -->
    <polygon points="250,0 550,0 450,90 150,90" fill="url(#feGrad)" stroke="#60a5fa" stroke-width="2" filter="url(#glow)"/>
    <!-- Left Face -->
    <polygon points="150,90 450,90 450,110 150,110" fill="#1e40af" opacity="0.9"/>
    <!-- Right Face -->
    <polygon points="450,90 550,0 550,20 450,110" fill="#1e3a8a" opacity="0.9"/>
    <!-- Label -->
    <text x="350" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle">
      1. Next.js 16 Frontend Tier
    </text>
    <text x="350" y="64" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#dbeafe" text-anchor="middle">
      Clerk JWT Auth • Web Speech API • Tailwind CSS v4 • Voice / Chat UI
    </text>
  </g>

  <!-- Connection Line 1 -> 2 -->
  <path d="M 480 215 L 480 265" stroke="#3b82f6" stroke-width="4" stroke-dasharray="6,6" filter="url(#lineGlow)"/>
  <polygon points="480,272 474,260 486,260" fill="#3b82f6"/>

  <!-- 3D LAYER 2: EXPRESS API GATEWAY TIER -->
  <g transform="translate(180, 260)">
    <!-- Top Face -->
    <polygon points="250,0 550,0 450,90 150,90" fill="url(#gwGrad)" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
    <!-- Left Face -->
    <polygon points="150,90 450,90 450,110 150,110" fill="#5b21b6" opacity="0.9"/>
    <!-- Right Face -->
    <polygon points="450,90 550,0 550,20 450,110" fill="#4c1d95" opacity="0.9"/>
    <!-- Label -->
    <text x="350" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle">
      2. Express.js API Gateway Tier
    </text>
    <text x="350" y="64" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#f3e8ff" text-anchor="middle">
      Rate Limiter (100 req/15m) • Clerk Auth Guard • Proxy Router
    </text>
  </g>

  <!-- Connection Line 2 -> 3 -->
  <path d="M 480 365 L 480 415" stroke="#a855f7" stroke-width="4" stroke-dasharray="6,6" filter="url(#lineGlow)"/>
  <polygon points="480,422 474,410 486,410" fill="#a855f7"/>

  <!-- 3D LAYER 3: FASTAPI & LANGGRAPH AGENT ENGINE (CORE) -->
  <g transform="translate(140, 410)">
    <!-- Top Face -->
    <polygon points="290,0 630,0 510,120 170,120" fill="url(#beGrad)" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <!-- Left Face -->
    <polygon points="170,120 510,120 510,145 170,145" fill="#065f46" opacity="0.9"/>
    <!-- Right Face -->
    <polygon points="510,120 630,0 630,25 510,145" fill="#044e37" opacity="0.9"/>
    <!-- Label -->
    <text x="400" y="40" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">
      3. FastAPI &amp; LangGraph Multi-Agent Engine
    </text>
    <text x="400" y="65" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#a7f3d0" text-anchor="middle">
      🕵️ Observer Subgraph • 👔 Interviewer Subgraph (8-Phase FSM) • ⚖️ Evaluator Subgraph
    </text>
    <text x="400" y="88" font-family="system-ui, sans-serif" font-weight="500" font-size="11" fill="#ecfdf5" text-anchor="middle">
      SQLiteCache • Exponential Backoff Retry • LangSmith Observability Tracing
    </text>
  </g>

  <!-- Branching Connection Lines to Storage & LLMs -->
  <path d="M 320 545 L 240 610" stroke="#10b981" stroke-width="4" stroke-dasharray="5,5" filter="url(#lineGlow)"/>
  <polygon points="234,615 240,602 248,610" fill="#10b981"/>

  <path d="M 640 545 L 720 610" stroke="#10b981" stroke-width="4" stroke-dasharray="5,5" filter="url(#lineGlow)"/>
  <polygon points="726,615 712,610 720,602" fill="#10b981"/>

  <!-- 3D LAYER 4A: STORAGE TIER (SUPABASE PGVECTOR) -->
  <g transform="translate(50, 600)">
    <!-- Top Face -->
    <polygon points="180,0 380,0 300,75 100,75" fill="url(#dbGrad)" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
    <!-- Left Face -->
    <polygon points="100,75 300,75 300,90 100,90" fill="#92400e" opacity="0.9"/>
    <!-- Right Face -->
    <polygon points="300,75 380,0 380,15 300,90" fill="#78350f" opacity="0.9"/>
    <!-- Label -->
    <text x="240" y="34" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle">
      4A. Supabase PostgreSQL
    </text>
    <text x="240" y="54" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#fef3c7" text-anchor="middle">
      `pgvector` Store • Transcripts &amp; Profile
    </text>
  </g>

  <!-- 3D LAYER 4B: INTELLIGENCE TIER (GEMINI MODELS) -->
  <g transform="translate(550, 600)">
    <!-- Top Face -->
    <polygon points="180,0 380,0 300,75 100,75" fill="url(#feGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <!-- Left Face -->
    <polygon points="100,75 300,75 300,90 100,90" fill="#0369a1" opacity="0.9"/>
    <!-- Right Face -->
    <polygon points="300,75 380,0 380,15 300,90" fill="#075985" opacity="0.9"/>
    <!-- Label -->
    <text x="240" y="34" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle">
      4B. Google Gemini Engine
    </text>
    <text x="240" y="54" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#e0f2fe" text-anchor="middle">
      2.5-Flash-Lite • 2.0-Flash • text-embedding-004
    </text>
  </g>

  <!-- Legend Box (Right side) -->
  <g transform="translate(860, 150)">
    <rect width="280" height="420" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="2"/>
    <text x="140" y="35" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">
      SYSTEM CAPABILITIES
    </text>

    <circle cx="30" cy="75" r="8" fill="#3b82f6"/>
    <text x="50" y="80" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Next.js 16 UI</text>
    <text x="50" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Voice &amp; Chat Modes with Clerk Auth</text>

    <circle cx="30" cy="135" r="8" fill="#8b5cf6"/>
    <text x="50" y="140" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">API Gateway</text>
    <text x="50" y="158" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Rate limiting &amp; Bearer JWT guard</text>

    <circle cx="30" cy="195" r="8" fill="#10b981"/>
    <text x="50" y="200" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">LangGraph Pipeline</text>
    <text x="50" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Observer ➔ Interviewer ➔ Evaluator</text>

    <circle cx="30" cy="255" r="8" fill="#f59e0b"/>
    <text x="50" y="260" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Supabase pgvector</text>
    <text x="50" y="278" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Session-scoped resume/JD RAG</text>

    <circle cx="30" cy="315" r="8" fill="#38bdf8"/>
    <text x="50" y="320" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Gemini Dual-LLM</text>
    <text x="50" y="338" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Exponential retry &amp; model fallback</text>

    <circle cx="30" cy="375" r="8" fill="#ec4899"/>
    <text x="50" y="380" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Evaluation Report</text>
    <text x="50" y="398" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">0-100 rubric scoring across 4 pillars</text>
  </g>

</svg>
