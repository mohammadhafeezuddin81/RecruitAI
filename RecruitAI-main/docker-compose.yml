version: "3.8"

services:
  # 1. PostgreSQL with pgvector (matches Supabase environment)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recruitai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=recruitai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. FastAPI Multi-Agent Brain
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitai-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recruitai
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 3. Node/Express API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: recruitai-gateway
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - FASTAPI_BASE_URL=http://backend:8000
      - FASTAPI_TIMEOUT_MS=60000
      - CLERK_JWT_ISSUER=${CLERK_JWT_ISSUER:-https://clerk.your-domain.com}
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

  # 4. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruitai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_VAPI_PUBLIC_KEY=${NEXT_PUBLIC_VAPI_PUBLIC_KEY:-}
      - NEXT_PUBLIC_VAPI_ASSISTANT_ID=${NEXT_PUBLIC_VAPI_ASSISTANT_ID:-}
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
