<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background:#0b0f19; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="1">RECRUITAI — PRODUCTION ARCHITECTURE</text>
  <text x="550" y="70" text-anchor="middle" fill="#94a3b8" font-size="14">Multi-Agent LangGraph Orchestration • Express Gateway • RAG Ingestion • Cloud Run</text>

  <!-- Next.js Frontend Box -->
  <rect x="350" y="100" width="400" height="75" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="550" y="132" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="600">🎨 Next.js 14 Frontend</text>
  <text x="550" y="155" text-anchor="middle" fill="#94a3b8" font-size="13">Clerk Auth • Vapi Voice UI • WebRTC &amp; VAD</text>

  <!-- Arrow: Frontend -> Gateway -->
  <path d="M 550 175 L 550 215" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="590" y="200" fill="#38bdf8" font-size="12" font-weight="500">HTTPS (Clerk JWT)</text>

  <!-- Node/Express Gateway Box -->
  <rect x="300" y="220" width="500" height="85" rx="12" fill="url(#gatewayGrad)" stroke="#10b981" stroke-width="2" />
  <text x="550" y="252" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="600">🛡️ Node/Express API Gateway (Cloud Run Public)</text>
  <text x="550" y="278" text-anchor="middle" fill="#94a3b8" font-size="13">Auth Guard • Input Validation • Rate Limiting (100 req/15m) • Route Proxy</text>

  <!-- Arrow: Gateway -> FastAPI Backend -->
  <path d="M 550 305 L 550 345" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="615" y="330" fill="#34d399" font-size="12" font-weight="500">Internal VPC / IAM Token</text>

  <!-- Python FastAPI Agent Service Container -->
  <rect x="100" y="350" width="900" height="340" rx="16" fill="url(#agentGrad)" stroke="#6366f1" stroke-width="2" />
  <text x="130" y="382" fill="#e0e7ff" font-size="18" font-weight="700">⚡ Python FastAPI — Agent Service (Cloud Run Internal)</text>

  <!-- Supervisor Orchestrator Graph -->
  <rect x="140" y="405" width="820" height="155" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
  <text x="160" y="432" fill="#a5b4fc" font-size="14" font-weight="600">🧠 Orchestrator Supervisor Graph (LangGraph StateGraph)</text>

  <!-- Subgraph 1: Observer -->
  <rect x="160" y="450" width="220" height="85" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
  <text x="270" y="480" text-anchor="middle" fill="#f5d0fe" font-size="14" font-weight="600">🕵️ Observer Subgraph</text>
  <text x="270" y="502" text-anchor="middle" fill="#d8b4fe" font-size="11">Perception • Silence &gt; 2s</text>
  <text x="270" y="520" text-anchor="middle" fill="#c084fc" font-size="11">Hesitation &amp; Hint Trigger</text>

  <!-- Flow arrow: Observer -> Interviewer -->
  <path d="M 380 492 L 430 492" stroke="#a855f7" stroke-width="2" />

  <!-- Subgraph 2: Interviewer -->
  <rect x="430" y="450" width="240" height="85" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="550" y="480" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="600">👔 Interviewer Subgraph</text>
  <text x="550" y="502" text-anchor="middle" fill="#7dd3fc" font-size="11">8-Phase FSM Logic</text>
  <text x="550" y="520" text-anchor="middle" fill="#38bdf8" font-size="11">Resume RAG • Adaptive Probing</text>

  <!-- Flow arrow: Interviewer -> Evaluator -->
  <path d="M 670 492 L 720 492" stroke="#38bdf8" stroke-width="2" />

  <!-- Subgraph 3: Evaluator -->
  <rect x="720" y="450" width="220" height="85" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="830" y="480" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="600">⚖️ Evaluator Subgraph</text>
  <text x="830" y="502" text-anchor="middle" fill="#fde68a" font-size="11">Rubric RAG Retrieval</text>
  <text x="830" y="520" text-anchor="middle" fill="#fbbf24" font-size="11">Confidence Gated (retry &lt; 0.7)</text>

  <!-- Ingestion Pipeline & RAG Bar -->
  <rect x="140" y="580" width="390" height="90" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <text x="160" y="608" fill="#67e8f9" font-size="13" font-weight="600">📂 Ingestion &amp; RAG Vector Store</text>
  <text x="160" y="632" fill="#94a3b8" font-size="12">PyPDFLoader • RecursiveCharacterTextSplitter (800 chars)</text>
  <text x="160" y="652" fill="#94a3b8" font-size="12">ChromaDB metadata filter (session_id / role_category)</text>

  <!-- Reliability & Observability Bar -->
  <rect x="560" y="580" width="400" height="90" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
  <text x="580" y="608" fill="#f472b6" font-size="13" font-weight="600">⚡ Reliability &amp; Observability</text>
  <text x="580" y="632" fill="#94a3b8" font-size="12">LangSmith Tracing (all nodes &amp; subgraphs)</text>
  <text x="580" y="652" fill="#94a3b8" font-size="12">Gemini 2.5 Flash Lite + Retry/Fallback + SQLiteCache</text>

  <!-- Bottom Arrow: Backend -> Database -->
  <path d="M 550 690 L 550 730" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Firebase Firestore Box -->
  <rect x="350" y="730" width="400" height="65" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="550" y="758" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="600">🔥 Firebase Firestore</text>
  <text x="550" y="779" text-anchor="middle" fill="#94a3b8" font-size="12">Session State • Transcripts Array • Evaluation Reports</text>
</svg>
